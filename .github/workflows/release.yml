name: Release

on:
  push:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-and-release:
    # Нативный Windows-раннер: MSVC, rc.exe, link.exe уже на месте.
    # ВАЖНО: используем PowerShell, а не bash. В Git Bash первым в PATH
    # оказывается C:\Program Files\Git\usr\bin\link.exe (утилита coreutils),
    # и rustc вызывает её вместо линкера MSVC — сборка падает.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Версия: $version"

      - name: Create git tag if missing
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          $tag = "v${{ steps.version.outputs.VERSION }}"
          git rev-parse $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            git tag $tag
            git push origin $tag
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Проверяем, что линкер — действительно MSVC, а не Git-утилита.
      - name: Verify linker
        shell: pwsh
        run: |
          Write-Host "which link: $((Get-Command link.exe).Source)"

      - name: Build Windows binary
        shell: pwsh
        run: |
          cargo build --release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/zvukopad.exe zvukopad.exe

      # Тесты ловят рассинхрон версий (Cargo.toml ↔ resource.rc) и другие
      # регрессии до публикации релиза.
      - name: Run tests
        shell: pwsh
        run: |
          cargo test --release 2>&1 | Tee-Object -FilePath test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Диагностика: при ошибке публикуем хвост лога в issue (публично читаемо).
      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $parts = @()
          foreach ($name in @('build.log', 'test.log')) {
            if (Test-Path $name) {
              $parts += "== $name =="
              $parts += (Get-Content $name -Tail 400) -join "`n"
            }
          }
          if ($parts.Count -eq 0) { $parts = @('Логи сборки отсутствуют') }
          $body = (($parts -join "`n") -replace '```', "'''")
          $body = "Последние строки сборки:`n``````n$body`n``````"
          $body | Out-File -FilePath issue-body.md -Encoding utf8
          gh issue create --repo "${{ github.repository }}" --title "[CI] Ошибка сборки v${{ steps.version.outputs.VERSION }} (run ${{ github.run_id }})" --body-file issue-body.md

      - name: Create or update Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ steps.version.outputs.VERSION }}"
          $repo = "${{ github.repository }}"
          gh release view $tag --repo $repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag zvukopad.exe --repo $repo --clobber
          } else {
            gh release create $tag --repo $repo --title "Звукопад $tag" --notes "Релиз $tag" zvukopad.exe
          }