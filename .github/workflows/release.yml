name: Release

on:
  push:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag if missing
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if ! git rev-parse "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            git tag "v${{ steps.version.outputs.VERSION }}"
            git push origin "v${{ steps.version.outputs.VERSION }}"
          fi

      # Официальный action ставит стабильный Rust и нужный target за секунды.
      # Раньше здесь был `rustup update stable`, который на runner'ах зависал.
      - name: Install Rust (Windows target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      # Лёгкий пакет вместо всего mingw-w64: даёт windres и dlltool.
      - name: Install mingw-w64 linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Build Windows binary
        env:
          WINDOWS_RESOURCE_COMPILER: x86_64-w64-mingw32-windres
        run: |
          cargo build --release --target x86_64-pc-windows-gnu
          cp target/x86_64-pc-windows-gnu/release/zvukopad.exe zvukopad.exe

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" zvukopad.exe --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Звукопад $TAG" \
              --notes "Релиз $TAG" \
              zvukopad.exe
          fi