name: Release

on:
  push:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build-and-release:
    # Нативный Windows-раннер: MSVC, rc.exe, link.exe уже на месте —
    # не нужны mingw/apt-get и кросс-компиляция.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create git tag if missing
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          if ! git rev-parse "v${{ steps.version.outputs.VERSION }}" >/dev/null 2>&1; then
            git tag "v${{ steps.version.outputs.VERSION }}"
            git push origin "v${{ steps.version.outputs.VERSION }}"
          fi

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Собираем с сохранением лога, чтобы при падении можно было его прочитать.
      - name: Build Windows binary
        run: |
          set -o pipefail
          cargo build --release 2>&1 | tee build.log
          cp target/release/zvukopad.exe zvukopad.exe

      # Диагностика: при ошибке публикуем хвост лога в issue (публично читаемо).
      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo 'Лог сборки (последние 400 строк):'
            echo '```'
            tail -n 400 build.log 2>/dev/null || echo 'build.log отсутствует'
            echo '```'
          } > issue-body.md
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[CI] Ошибка сборки v${{ steps.version.outputs.VERSION }} (run ${{ github.run_id }})" \
            --body-file issue-body.md

      - name: Create or update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.VERSION }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" zvukopad.exe --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "Звукопад $TAG" \
              --notes "Релиз $TAG" \
              zvukopad.exe
          fi