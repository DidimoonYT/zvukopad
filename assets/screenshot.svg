  <text x="1150" y="63" fill="#7d8088" font-size="16" text-anchor="middle">✕</text>

  <!-- Sidebar -->
  <rect x="40" y="84" width="330" height="559" fill="#1d1e22"/>
  <line x1="370" y1="84" x2="370" y2="643" stroke="#35373c"/>

  <text x="72" y="126" fill="#8b8f98" font-size="12" font-weight="700" letter-spacing="1.5">УСТРОЙСТВО ВЫВОДА</text>
  <rect x="64" y="140" width="282" height="44" rx="8" fill="#2a2c31" stroke="#3b3e45"/>
  <text x="82" y="167" fill="#e6e8ec" font-size="14">CABLE Input (VB-Audio)</text>
  <text x="326" y="167" fill="#7d8088" font-size="12" text-anchor="end">▾</text>

  <text x="72" y="220" fill="#8b8f98" font-size="12" font-weight="700" letter-spacing="1.5">УСТРОЙСТВО МОНИТОРИНГА</text>
  <rect x="64" y="234" width="282" height="44" rx="8" fill="#2a2c31" stroke="#3b3e45"/>
  <text x="82" y="261" fill="#e6e8ec" font-size="14">Наушники (Realtek)</text>
  <text x="326" y="261" fill="#7d8088" font-size="12" text-anchor="end">▾</text>

  <text x="72" y="314" fill="#8b8f98" font-size="12" font-weight="700" letter-spacing="1.5">ИМИТАЦИЯ МИКРОФОНА (PTT)</text>
  <rect x="64" y="328" width="282" height="44" rx="8" fill="#2a2c31" stroke="#3b3e45"/>
