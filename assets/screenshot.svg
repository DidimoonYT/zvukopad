<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1f22"/>
      <stop offset="1" stop-color="#151619"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>

  <!-- Window -->
  <rect x="40" y="32" width="1120" height="611" rx="14" fill="#232428" stroke="#35373c" filter="url(#shadow)"/>

  <!-- Title bar -->
  <rect x="40" y="32" width="1120" height="52" rx="14" fill="#2a2b30"/>
  <rect x="40" y="70" width="1120" height="14" fill="#2a2b30"/>
  <circle cx="70" cy="58" r="6" fill="#ff5f57"/>
  <circle cx="90" cy="58" r="6" fill="#febc2e"/>
  <circle cx="110" cy="58" r="6" fill="#28c840"/>
  <text x="600" y="63" fill="#c9cbd1" font-size="15" font-weight="600" text-anchor="middle">Звукопад v1.0.16</text>
